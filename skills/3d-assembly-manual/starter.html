<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Assembly Manual Starter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--paper:#f7f7f5;--card:#ffffff;--ink:#151617;--ink-2:#46484b;--muted:#8a8c8f;--rule:#e3e3df;--accent:#d7261e;--accent-ink:#9b150f;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--display:"Archivo","Arial Black","Helvetica Neue",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:minmax(300px,60%) minmax(0,1fr)}
@media (min-width:960px){.app{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 420px}}

.stage{position:relative;overflow:hidden;background:var(--paper);border-bottom:1px solid var(--rule)}
@media (min-width:960px){.stage{border-bottom:0;border-right:1px solid var(--rule)}}
#c{position:absolute;left:0;top:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hd{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hd h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.hd .sub{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.hd .where{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd .where b{font-weight:500;color:var(--ink)}
.hd-rule{position:absolute;left:16px;right:16px;top:54px;border-top:1px solid var(--rule)}

.callout{position:absolute;left:16px;top:66px;max-width:calc(100% - 190px);background:var(--card);border:1px solid var(--rule);padding:6px 8px}
.callout[hidden]{display:none}
.callout .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.callout ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;flex-wrap:wrap;max-width:420px}
.callout li{width:54px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.callout li:hover img,.callout li:active img{border-color:var(--ink)}
.callout .th{position:relative;width:46px;height:46px}
.callout img{width:46px;height:46px;display:block;background:var(--card);border:1px solid var(--rule)}
.callout .q{position:absolute;right:-6px;bottom:-4px;font-family:var(--mono);font-size:10px;background:var(--ink);color:var(--card);padding:1px 4px;line-height:1.3;font-variant-numeric:tabular-nums}
.callout .nm{font-size:10.5px;line-height:1.2;text-align:center;color:var(--ink-2);text-wrap:balance}

.side{position:absolute;right:16px;top:66px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.card{border:1px solid var(--rule);background:transparent}
.card .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card);padding:5px 7px 4px;display:flex;justify-content:space-between}
.plan{pointer-events:none}
.view{width:136px;height:136px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--card);border:1px solid var(--rule);padding:5px 8px;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip[hidden]{display:none}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

#dims{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dim,.note,.mark{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform;white-space:nowrap}
.dim,.note{font-family:var(--mono);font-size:11px;line-height:1.2;background:var(--card);border:1px solid var(--ink);color:var(--ink);padding:1px 5px;font-variant-numeric:tabular-nums}
.note{border-color:var(--rule);color:var(--ink-2)}
.mark{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);font:400 10.5px/20px var(--mono);text-align:center;box-shadow:0 0 0 1.5px var(--card),0 0 0 2.5px var(--ink)}
.mark i{position:absolute;left:50%;top:50%;height:1px;background:var(--ink);transform-origin:0 50%;box-shadow:0 1px 0 var(--card)}
.dim.on,.note.on,.mark.on{opacity:1}

.detail{position:absolute;right:16px;bottom:36px;pointer-events:none;display:none;transform-origin:50% 50%}
.detail.on{display:block}
.detail .view{width:150px;height:150px}
.leader,.ring{position:absolute;left:0;top:0;pointer-events:none;display:none}
.leader{height:1px;background:var(--ink);transform-origin:0 50%}
.ring{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink);box-shadow:0 0 0 1px var(--card) inset}
.detail.on ~ .leader,.detail.on ~ .ring{display:block}

.cap{position:absolute;left:16px;bottom:40px;pointer-events:none;display:flex;align-items:flex-end;gap:12px}
.cap .n{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,84px);line-height:.78;color:var(--accent);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cap .w{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.2vw,38px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
.cap .s{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.04em;margin-top:6px;text-transform:uppercase}
.scale{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;pointer-events:none}
.scale i{display:block;height:7px;border:1px solid var(--ink);border-top:0}
.hint{position:absolute;right:16px;bottom:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted);pointer-events:none}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.22,1,.36,1)}

.panel{display:flex;flex-direction:column;min-height:0;background:var(--card)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:16px 20px 20px}
.dots{display:flex;gap:4px;margin:0 0 12px}
.dots button{flex:1;height:4px;border:0;padding:0;background:var(--rule);position:relative}
.dots button::after{content:"";position:absolute;inset:-8px 0}
.dots button.done{background:var(--ink)}
.dots button.cur{background:var(--accent)}
.body{min-width:0;transition:opacity .16s}
.tabline{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.num{font-family:var(--display);font-size:46px;line-height:.85;font-weight:800;letter-spacing:-.04em;grid-row:span 2;color:var(--accent);font-variant-numeric:tabular-nums}
.num:empty{display:none}
.num:empty ~ *{grid-column:1 / -1}
.title{font-family:var(--display);font-size:19px;font-weight:800;text-transform:uppercase;margin:2px 0 0;letter-spacing:-.005em;text-wrap:balance}
.text{margin:0;color:var(--ink-2);line-height:1.5;max-width:62ch}
.text:empty{display:none}
.acts{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:9px}
.acts:empty{display:none}
.acts li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;line-height:1.45;max-width:62ch}
.acts b{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);font:400 10.5px/20px var(--mono);text-align:center;margin-top:1px}
.meta{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.meta:empty{display:none}
.meta b{color:var(--accent-ink);font-weight:500}
.tip{margin:12px 0 0;padding:9px 11px;background:var(--paper);border-left:2px solid var(--accent);color:var(--ink-2);font-size:13px;line-height:1.45;max-width:62ch}
.tip:empty{display:none}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.inv{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.inv li{border:1px solid var(--rule);background:var(--card);padding:8px 6px 6px;display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.inv img{width:46px;height:46px;display:block}
.inv .q{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.inv .nm{font-size:12px;line-height:1.25;text-wrap:balance;min-width:0}
.cal{margin:14px 0 0;padding:0;list-style:none}
.cal li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}
.cal .d{font-family:var(--mono);font-size:11px;color:var(--ink-2);min-width:8em;padding-top:1px;font-variant-numeric:tabular-nums}

.foot{display:grid;grid-template-columns:auto 1fr 1.6fr;gap:8px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--card)}
.timer{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--card);padding:0 10px;display:grid;place-items:center;font-variant-numeric:tabular-nums;min-width:62px}
.btn{height:44px;border:1px solid var(--rule);background:var(--card);font-weight:500;padding:0 14px}
.btn:disabled{color:var(--muted);cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{background:#000}
.btn:not(.primary):not(:disabled):hover{border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){.progress i,.dim,.note,.mark,.body{transition:none}}
@media (max-width:759px){.callout{padding:5px 6px 4px;max-width:calc(100% - 140px)}.callout .h{font-size:9px;margin:0 0 4px}.callout ul{flex-wrap:nowrap;overflow-x:auto;gap:6px;max-width:none;scrollbar-width:none;padding-bottom:2px}.callout ul::-webkit-scrollbar{display:none}.callout li{flex:0 0 40px;width:40px}.callout .th,.callout img{width:32px;height:32px}.callout .q{font-size:9px;padding:0 3px}.callout .nm{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40px}
  .callout.more::after{content:"";position:absolute;right:0;top:0;bottom:0;width:28px;background:linear-gradient(to right,rgba(255,255,255,0),var(--card));pointer-events:none}
  .view{width:84px;height:84px}.detail .view{width:104px;height:104px}.hint{display:none}.detail{bottom:14px}.cap{bottom:34px}.cap .s{display:none}}
</style>
<div class="app">
  <section class="stage" aria-label="3D build diagram">
    <canvas id="c"></canvas>
    <div class="hd">
      <div><h1 id="h1"></h1><span class="sub" id="sub"></span></div>
      <span class="where" id="where"></span>
    </div>
    <div class="hd-rule"></div>
    <div id="dims"></div>
    <div class="callout" id="callout" hidden><p class="h">Parts · tap one to find it</p><ul id="parts"></ul></div>
    <div class="side">
      <div class="card plan" aria-hidden="true"><div class="lbl"><span>Plan</span></div><div class="view" id="planView"></div></div>
      <button class="chip" id="replay" type="button"><span class="dot"></span>Replay</button>
    </div>
    <div class="cap" id="cap"></div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleTxt">1 ft</span></div>
    <div class="hint">Drag to turn</div>
    <div class="card detail" id="detail"><div class="lbl"><span>Detail</span></div><div class="view" id="detailView"></div></div><div class="leader" id="leader"></div><div class="ring" id="ring"></div>
    <div class="progress"><i id="bar"></i></div>
  </section>
  <section class="panel" aria-label="Steps">
    <div class="scroll" id="sheet">
      <div class="dots" id="dots"></div>
      <div class="body" id="body">
        <div class="tabline" id="tabline"></div>
        <div class="step-head"><div class="num" id="num"></div><h2 class="title" id="title"></h2><p class="text" id="text"></p></div>
        <ol class="acts" id="acts"></ol>
        <div class="meta" id="meta"></div>
        <p class="tip" id="tip"></p>
        <div id="extra"></div>
      </div>
    </div>
    <div class="foot">
      <div class="timer" id="timer" aria-label="Elapsed time">00:00</div>
      <button class="btn" id="prev" type="button">Back</button>
      <button class="btn primary" id="next" type="button">Next step</button>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======================================================================
   CONFIG: everything project-specific that is data lives here.
   Scene geometry, part builders (P) and reg() calls live in the
   PROJECT SCENE block further down (they need the helpers). Units: feet.
   ====================================================================== */
var CONFIG = {
  title: 'Bookshelf manual',
  subtitle: 'Three-shelf unit, 3 × 4 ft',
  date: 'Sep 26',                       /* shown top right: "Sep 26 · 2 of 4" */
  storageKey: 'shelf.step',             /* localStorage key for the last page; unique per manual */
  accent: 0xd7261e,                     /* flat red: arrows, plan frame, outline flash, the big step numbers (CSS --accent) */
  fill: 0xe2352c,                       /* this step's parts, shaded ... */
  fillInk: 0x8e1510,                    /* ... with dark red ink (CSS --accent-ink) */
  view: [1, 0.8, 1.25],                 /* default three-quarter view direction */
  plan: null,                           /* plan inset {c:[x,z], r}; null = derived from the scene's bounds */
  figure: null,                         /* off by default (people read as off in these models); opt in with [x, z, rotY?] for a flat Modulor cut-out */
  CAM: {                                /* presets: c centre, r half-height (ft); optional v (view), walls ({h, sides}), cut ([keys]) */
    overview: {c: [-0.5, 3.2, 0.3], r: 4.4},   /* wide enough for the scale figure's raised hand */
    base:     {c: [0, 1.4, 0], r: 2.7},
    back:     {c: [0, 2.6, -0.5], r: 3.7, v: [-0.9, 0.7, -1.2], walls: {h: 0.6, sides: ['N', 'W']}},
    joint:    {c: [1.0, 0.7, 0.2], r: 1.3}
  },
  NAMES: { side: 'Side panel', shelf: 'Shelf', back: 'Back panel', screw: 'Screw, 1¼ in', driver: 'Screwdriver' },
  INVENTORY: [
    ['In the box', [['side', '2'], ['shelf', '3'], ['back', '1'], ['screw', '4']]],
    ['From the house', [['driver', '1']]]
  ],
  /* step keys: title, word (one word for the stage caption), cam, text, acts [[text, [x,y,z] | null, [dx,dy]]], meta ('a · b · c'), time, tip,
     parts [[partKey, qty]], dims [{a, b, off, label}], notes [{p, text}], detail {p, r, hide:[objKeys], view:[x,y,z]}, inventory,
     calendar [[date, text]], view [x,y,z], walls {h, sides}, cut [objKeys], onEnter(t) -> optional new end time (ms) */
  STEPS: [
    {title: 'What this builds', cam: 'overview', inventory: true, time: '≈30 min',
     text: 'A three-shelf unit against the wall. Every part is below, in the order the steps use it.',
     tip: 'Lay the parts out on the carton so nothing scratches.'},
    {title: 'Sides and bottom shelf', word: 'Base', cam: 'base', parts: [['side', '2'], ['shelf', '1']], time: '≈10 min',
     text: 'Stand the sides up and seat the bottom shelf between them.',
     acts: [['Stand both sides on their back edges, holes facing in.', [-1.47, 1.8, 0.5], [-26, 0]], ['Drop the bottom shelf onto its pins, 3 in off the floor.', [0.7, 0.3, 0.45], [24, 26]]],
     meta: 'Pins at 3 in', tip: 'The sides are mirror images: the pin holes face each other.',
     dims: [{a: [-1.5, 0, 0.5], b: [1.5, 0, 0.5], off: [0, 0, 0.5], label: '3 ft'}, {a: [1.5, 0, 0.5], b: [1.5, 4, 0.5], off: [0.5, 0, 0], label: '4 ft'}]},
    {title: 'Middle and top shelves', word: 'Shelves', cam: 'overview', parts: [['shelf', '2']], time: '≈5 min',
     text: 'The middle shelf sits on pins; the top one caps the sides.',
     acts: [['Middle shelf onto the pins at 2 ft.', [0, 2.05, 0.45], [0, 30]], ['Top shelf flush with the tops of the sides.', [0, 3.99, 0.45], [0, -30]]],
     meta: 'Middle at 2 ft · top flush', detail: {p: [1.44, 2.0, 0.4], r: 0.35}},
    {title: 'Back panel', word: 'Back', cam: 'back', parts: [['back', '1']], time: '≈5 min',
     text: 'From behind: the panel squares the unit.',
     acts: [['Slide the panel into the rear grooves from the top.', [0, 3.6, -0.52], [0, -30]], ['Check the diagonals match, then push the unit to the wall.', null]],
     meta: 'Diagonals equal = square', tip: 'The wall behind is drawn cut down so you can see the back.'},
    {title: 'Screw the corners', word: 'Screws', cam: 'joint', parts: [['screw', '4'], ['driver', '1']], cut: ['sideR'], time: '≈10 min',
     text: 'Four screws through the sides into the bottom and top shelves.',
     acts: [['A screw through each side into the bottom shelf.', [1.5, 0.25, 0], [30, 10]], ['Two more into the top shelf, hand-tight.', null]],
     meta: '4 screws · hand-tight', tip: 'The near side is drawn faint so you can see the screw bite the shelf end.',
     detail: {p: [1.5, 0.25, 0], r: 0.22, hide: ['sideR'], view: [1, 0.35, 0.45]},   /* the detail hides the side so the screw reads in the shelf end */
     onEnter: function(t){ /* the screws drive home: two turns after they land */
       var s = t.objs.screwsR.children.concat(t.objs.screwsL.children); t.tween(700, function(e){ s.forEach(function(ch){ ch.rotation.x = e * Math.PI * 4; }); }, t.ease, t.lastLand + 200); return t.lastLand + 900; }},
    {title: 'Done', cam: 'overview', text: 'Load the heavy books on the bottom shelf.',
     calendar: [['In a week', 'Re-tighten the four screws']]}
  ]
};

(function(){
var T = THREE;
var $ = function(s){ return document.querySelector(s); };
var canvas = $('#c'), stage = $('.stage');
var hm = /^#step(\d+)(&still)?$/.exec(location.hash || '');
var STILL = !!(hm && hm[2]);                       /* capture mode: no tweens, no idle drift */
var reduce = STILL || matchMedia('(prefers-reduced-motion: reduce)').matches;
/* the drawing: white model, ink edges, soft grey ink for context, glass the only see-through surface,
   this step's parts in shaded red with dark red ink, arrows in flat red, on paper with a faint grid */
var INK = 0x242527, SOFT = 0x8d8e8b, WHITE = 0xffffff, GLASS = 0xdfe4e6, PAPER = 0xf7f7f5, GRID = 0xe6e6e0;
var ACCENT = CONFIG.accent, FILL = CONFIG.fill, FILL_INK = CONFIG.fillInk;
var VIEW = new T.Vector3().fromArray(CONFIG.view).normalize();
var CAM = CONFIG.CAM, NAMES = CONFIG.NAMES, INVENTORY = CONFIG.INVENTORY, STEPS = CONFIG.STEPS;
function css(hex){ return '#' + ('00000' + hex.toString(16)).slice(-6); }
document.title = CONFIG.title.charAt(0).toUpperCase() + CONFIG.title.slice(1); $('#h1').textContent = CONFIG.title; $('#sub').textContent = CONFIG.subtitle || '';
document.documentElement.style.setProperty('--accent', css(ACCENT)); document.documentElement.style.setProperty('--accent-ink', css(FILL_INK));

/* ---------- renderer, light, paper ---------- */
var renderer = new T.WebGLRenderer({canvas: canvas, antialias: true, alpha: false, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(PAPER, 1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
var scene = new T.Scene(); scene.background = new T.Color(PAPER);
var fog = new T.Fog(PAPER, 1e6, 2e6); scene.fog = fog;   /* follows the camera so it starts just behind the model */
var world = new T.Group(); scene.add(world);
scene.add(new T.AmbientLight(0xffffff, 0.7));
scene.add(new T.HemisphereLight(0xffffff, GRID, 0.2));
var SUN_DIR = new T.Vector3(-150, 260, 190).normalize();   /* high, from the front left */
var sun = new T.DirectionalLight(0xffffff, 0.42); sun.castShadow = true;
sun.shadow.mapSize.set(STILL ? 1024 : 2048, STILL ? 1024 : 2048); sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);
var camera = new T.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
var planCam = new T.OrthographicCamera(-1, 1, 1, -1, 1, 400); planCam.up.set(0, 0, -1); planCam.layers.enable(1);
var detailCam = new T.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);

/* ---------- helpers (units: feet) ---------- */
function v(a){ return new T.Vector3(a[0], a[1], a[2]); }
function mat(color, opacity){ var o = opacity == null ? 1 : opacity; return new T.MeshLambertMaterial({color: color, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, transparent: o < 1, opacity: o}); }
